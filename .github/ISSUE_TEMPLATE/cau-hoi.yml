name: ❓ Câu hỏi khi sử dụng
description: Không biết cài, không biết dùng lệnh nào, hoặc lỡ khóa mất máy con
title: "[Hỏi] "
labels: ["câu hỏi"]
body:
  - type: markdown
    attributes:
      value: |
        Trước khi hỏi, thử tìm trong [hướng dẫn sử dụng](https://github.com/iatoi/iatoi-update/blob/main/HUONG_DAN.md) — phần lớn câu hỏi đã có sẵn ở đó.

        **Lỡ khóa quá tay?** Xem [mục 6: Mở khóa khi lỡ khóa hết](https://github.com/iatoi/iatoi-update/blob/main/HUONG_DAN.md#6-mở-khóa-khi-lỡ-khóa-hết-trên-máy) — luôn mở được từ xa, không cần cầm máy con.
  - type: textarea
    id: cau-hoi
    attributes:
      label: Bạn muốn hỏi gì
    validations:
      required: true
  - type: input
    id: phien-ban
    attributes:
      label: Phiên bản IATOI (nếu đã cài)
      placeholder: "3.8.4"
